
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <div id="debug-log" style="position:fixed; top:0; left:0; right:0; z-index:9999; background:black; color:lime; font-family:monospace; font-size:12px; padding:8px; max-height:50vh; overflow:auto; white-space:pre-wrap;"></div>
<script>
  const debugLog = document.getElementById('debug-log');
  function logToScreen(msg) {
    debugLog.textContent += msg + '\n';
  }
  window.onerror = function(msg, url, line, col, error) {
    logToScreen('ERROR: ' + msg + ' (línea ' + line + ')');
  };
  window.onunhandledrejection = function(event) {
    logToScreen('PROMESA RECHAZADA: ' + event.reason);
  };
  logToScreen('Página cargada, esperando cámara...');

  // Prueba directa de la cámara, sin MindAR de por medio
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(function(stream) {
      logToScreen('CÁMARA OK: acceso concedido');
      stream.getTracks().forEach(t => t.stop());
    })
    .catch(function(err) {
      logToScreen('CÁMARA FALLÓ: ' + err.name + ' - ' + err.message);
    });

  // Comprueba si el archivo targets.mind se puede descargar
  fetch('./targets.mind')
    .then(function(res) {
      logToScreen('targets.mind status: ' + res.status);
    })
    .catch(function(err) {
      logToScreen('targets.mind FETCH ERROR: ' + err.message);
    });
</script>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="blue" opaciy="0.5" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>
    <script>
  const sceneEl = document.querySelector('a-scene');

  sceneEl.addEventListener('loaded', function () {
    logToScreen('a-scene: loaded (DOM listo)');
  });

  sceneEl.addEventListener('renderstart', function () {
    logToScreen('a-scene: renderstart (motor 3D arrancó)');
  });

  sceneEl.addEventListener('arReady', function () {
    logToScreen('MindAR: arReady (tracking listo)');
  });

  sceneEl.addEventListener('arError', function (err) {
    logToScreen('MindAR: arError -> ' + JSON.stringify(err.detail));
  });

  // Chequeo a los 8 segundos: ¿existe ya el <video> de la cámara en el DOM?
  setTimeout(function () {
    const video = document.querySelector('video');
    if (video) {
      logToScreen('VIDEO encontrado: ' + video.videoWidth + 'x' + video.videoHeight + ', paused=' + video.paused);
    } else {
      logToScreen('NO se encontró ningún <video> en el DOM todavía');
    }
  }, 8000);
</script>
  </body>
</html>
